<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        
        <nav>
            <div class="logo-name">
                <img src="Gemini_Generated_Image_4iq7274iq7274iq7-removebg-preview.png" alt="our-logo">
                <span>Whale Loans</span>
            </div>
            <div class="menu">
                <button class="menu-btn"><i class="fa-solid fa-house"></i><span>DashBoard</span></button>
                <button class="menu-btn"><i class="fa-solid fa-coins"></i><span>Stake</span></button>
                <button class="menu-btn"><i class="fa-solid fa-table"></i><span>Band</span></button>
                <button class="menu-btn"><i class="fa-solid fa-calculator"></i><span>Calculator</span></button>
                <button class="menu-btn"><i class="fa-solid fa-vault"></i><span>Vaults</span></button>
                <button class="menu-btn"><i class="fa-solid fa-chart-line"></i><span>Leverage</span></button>
                <button class="menu-btn"><i class="fa-solid fa-bolt-lightning"></i><span>Flash Mint</span></button>
                <button class="menu-btn"><i class="fa-regular fa-file-lines"></i><span>Docs</span></button>
            </div>
            <div class="social-media">
                <a href=""><i class="fa-brands fa-discord"></i></a>
                <a href=""><i class="fa-brands fa-github"></i></a>
                <a href=""><i class="fa-brands fa-twitter"></i></a>
                <a href=""><i class="fa-brands fa-facebook"></i></a>
            </div>
        </nav>
        <main>
            <header>
                <img src="Gemini_Generated_Image_4iq7274iq7274iq7-removebg-preview.png" alt="our-logo">
                <div class="rate"><i class="fa-solid fa-circle-exclamation"></i><span>1 HUMP = $8.43</span></div>
                <div class="buttons-wrapper">
                <button class="connect-wallet-btn" id="connect-wallet">Connect Wallet</button>
                <button class="dark-mode"><i class="fa-regular fa-moon"></i></button>
                </div>
                <div class="nav-btn"><i class="fa-solid fa-bars-staggered"></i></div>
            </header>
            <section>
            <div class="stake-timer">
                <div class="stake"><span>Single Stake (3,3)</span></div>
                <div class="timer"><i class="fa-regular fa-clock"></i><span>7 hrs, 9 min to next rebase</span></div>
            </div>
            <div class="earning"><span class="amount"><i class="fa-solid fa-hand-holding-dollar"></i>  $0.00</span><span class="earn-day">Your Earning / Day</span></div>
            <div class="connect-wallet">
                <div class="wallet-img"><img src="output-onlinepngtools (2).png" alt="walletIMG"></div>
                <button class="connect-wallet-btn">Connect Wallet</button>
                <span>Connect your wallet to stake HUMP</span>
            </div>
            <div class="details">
                <div class="APY detail-panel">
                    <div class="header"><span>APY</span><i class="fa-solid fa-percent"></i></div>
                    <span>257,900%</span>
                </div>
                <div class="total-value-deposited detail-panel">
                    <div class="header"><span>APY</span><i class="fa-solid fa-arrow-up"></i></div>
                    <span>$571,320</span>
                </div>
                <div class="current-index detail-panel">
                    <div class="header"><span>APY</span><i class="fa-solid fa-bolt"></i></div>
                    <span>1.99 <span>HUMP</span></span>
                </div>
            </div>
            </section>
            <footer>
                <div class="copyright"> ©2022 Whale Loans | All rights reserved</div>
                <div class="badges">
                <span class="badge-item">
                    <i class="fa-solid fa-check"></i> KYC Verified
                </span>
                <span class="badge-item">
                    <i class="fa-solid fa-check"></i> MCN Ventures
                </span>
                </div>
           </footer>
        </main>
    </div>
   <script src="main.js"></script> 
</body>
</html>
